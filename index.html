<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Within - Middle School SEL Superhero Studio</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #printable-card, #printable-card * { visibility: visible; }
      #printable-card { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script>
    const { useState, createElement: h } = React;

    const SEL_STRENGTHS = [
      { id: 'resilience', name: 'Resilience / Grit', desc: 'Bouncing back after failure or tough challenges.' },
      { id: 'empathy', name: 'Empathy & Listening', desc: 'Understanding and supporting how others feel.' },
      { id: 'integrity', name: 'Integrity / Courage', desc: 'Doing the right thing even when no one is watching.' },
      { id: 'curiosity', name: 'Curiosity / Problem Solving', desc: 'Loving to learn, ask questions, and solve puzzles.' },
      { id: 'teamwork', name: 'Teamwork & Collaboration', desc: 'Working smoothly with others to achieve a goal.' },
      { id: 'calmness', name: 'Self-Regulation / Calm', desc: 'Staying cool and focused under pressure.' },
      { id: 'leadership', name: 'Positive Leadership', desc: 'Inspiring and guiding peers in a good direction.' },
      { id: 'kindness', name: 'Inclusion & Kindness', desc: 'Making sure everyone feels welcomed and valued.' }
    ];

    const ARCHETYPES = [
      { id: 'The Protector', title: 'The Protector', desc: 'Defends others and stands up for fairness.' },
      { id: 'The Strategist', title: 'The Strategist', desc: 'Mastermind problem-solver who plans ahead.' },
      { id: 'The Catalyst', title: 'The Catalyst', desc: 'Brings positive energy and sparks team action.' },
      { id: 'The Trailblazer', title: 'The Trailblazer', desc: 'Pioneers new ideas and stays true to self.' }
    ];

    const AVATAR_OPTIONS = {
      emblems: ['⚡', '🛡️', '💎', '🔥', '👁️', '🌟', '📚', '🧩'],
      colors: ['#3B82F6', '#10B981', '#8B5CF6', '#F59E0B', '#EF4444', '#EC4899']
    };

    function App() {
      const [step, setStep] = useState(1);
      const [heroData, setHeroData] = useState({
        heroAlias: '',
        archetype: ARCHETYPES[0].id,
        selectedStrengths: [],
        avatarConfig: { emblem: '⚡', primaryColor: '#3B82F6' },
        powers: [
          { strength: '', powerName: '', reflection: '' },
          { strength: '', powerName: '', reflection: '' },
          { strength: '', powerName: '', reflection: '' }
        ]
      });

      const nextStep = () => setStep((prev) => Math.min(prev + 1, 4));
      const prevStep = () => setStep((prev) => Math.max(prev - 1, 1));

      return h('div', { className: 'pb-12' },
        h('header', { className: 'border-b border-slate-800 bg-slate-900/90 sticky top-0 z-50 p-4' },
          h('div', { className: 'max-w-4xl mx-auto flex items-center justify-between' },
            h('div', { className: 'flex items-center space-x-2' },
              h('span', { className: 'text-2xl' }, '🦸‍♂️'),
              h('h1', { className: 'text-xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent uppercase tracking-wider' },
                'Hero Within ',
                h('span', { className: 'text-xs text-slate-400 font-normal' }, '| SEL 11 (SA-2)')
              )
            ),
            h('div', { className: 'flex items-center space-x-2 text-xs font-semibold' },
              [1, 2, 3, 4].map((i) =>
                h('div', {
                  key: i,
                  className: `w-7 h-7 rounded-full flex items-center justify-center ${
                    step === i ? 'bg-blue-600 text-white font-bold ring-2 ring-blue-400' :
                    step > i ? 'bg-slate-700 text-emerald-400' : 'bg-slate-800 text-slate-500'
                  }`
                }, step > i ? '✓' : i)
              )
            )
          )
        ),
        h('main', { className: 'max-w-4xl mx-auto mt-8 px-4' },
          step === 1 && h(Step1StrengthsSelect, { heroData, setHeroData, onNext: nextStep }),
          step === 2 && h(Step2AvatarStudio, { heroData, setHeroData, onNext: nextStep, onBack: prevStep }),
          step === 3 && h(Step3Dossier, { heroData, setHeroData, onNext: nextStep, onBack: prevStep }),
          step === 4 && h(Step4HeroCardPreview, { heroData, onBack: prevStep })
        )
      );
    }

    function Step1StrengthsSelect({ heroData, setHeroData, onNext }) {
      const toggleStrength = (strName) => {
        let current = [...heroData.selectedStrengths];
        if (current.includes(strName)) {
          current = current.filter((s) => s !== strName);
        } else {
          if (current.length >= 3) return;
          current.push(strName);
        }
        const updatedPowers = current.map((str, idx) => ({
          strength: str,
          powerName: heroData.powers[idx]?.powerName || '',
          reflection: heroData.powers[idx]?.reflection || ''
        }));
        setHeroData({ ...heroData, selectedStrengths: current, powers: updatedPowers });
      };

      const isValid = heroData.heroAlias.trim() && heroData.selectedStrengths.length === 3;

      return h('div', { className: 'space-y-6 bg-slate-900/60 p-6 rounded-2xl border border-slate-800' },
        h('div', null,
          h('h2', { className: 'text-2xl font-black text-white' }, '1. Hero Identity & Core Strengths'),
          h('p', { className: 'text-sm text-slate-400 mt-1' }, 'Give your hero an alias name and select your top 3 strengths.')
        ),
        h('div', { className: 'space-y-2' },
          h('label', { className: 'block text-xs uppercase font-bold text-slate-300' }, 'Superhero Alias Name'),
          h('input', {
            type: 'text',
            placeholder: 'e.g., The Mind Fortress, Apex Listener',
            value: heroData.heroAlias,
            onChange: (e) => setHeroData({ ...heroData, heroAlias: e.target.value }),
            className: 'w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white font-semibold focus:outline-none focus:border-blue-500'
          })
        ),
        h('div', { className: 'space-y-2' },
          h('label', { className: 'block text-xs uppercase font-bold text-slate-300' }, 'Select Archetype'),
          h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-3' },
            ARCHETYPES.map((arch) =>
              h('div', {
                key: arch.id,
                onClick: () => setHeroData({ ...heroData, archetype: arch.id }),
                className: `p-3 rounded-lg border cursor-pointer ${
                  heroData.archetype === arch.id ? 'bg-blue-900/40 border-blue-500 ring-1 ring-blue-400' : 'bg-slate-800/60 border-slate-700'
                }`
              },
                h('div', { className: 'font-bold text-sm text-white' }, arch.title),
                h('div', { className: 'text-xs text-slate-400' }, arch.desc)
              )
            )
          )
        ),
        h('div', { className: 'space-y-2' },
          h('label', { className: 'block text-xs uppercase font-bold text-slate-300' }, `Select Top 3 Strengths (${heroData.selectedStrengths.length}/3)`),
          h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-3' },
            SEL_STRENGTHS.map((str) => {
              const selected = heroData.selectedStrengths.includes(str.name);
              return h('div', {
                key: str.id,
                onClick: () => toggleStrength(str.name),
                className: `p-3 rounded-lg border cursor-pointer flex items-start space-x-3 ${
                  selected ? 'bg-emerald-950/60 border-emerald-500 text-white' :
                  heroData.selectedStrengths.length >= 3 ? 'bg-slate-900/40 border-slate-800 text-slate-600' : 'bg-slate-800/80 border-slate-700'
                }`
              },
                h('div', { className: `w-5 h-5 rounded border mt-0.5 flex items-center justify-center text-xs font-bold ${selected ? 'bg-emerald-500 text-slate-950' : 'border-slate-600'}` }, selected ? '✓' : ''),
                h('div', null,
                  h('div', { className: 'font-bold text-sm' }, str.name),
                  h('div', { className: 'text-xs text-slate-400' }, str.desc)
                )
              );
            })
          )
        ),
        h('button', {
          disabled: !isValid,
          onClick: onNext,
          className: `w-full py-3.5 font-bold rounded-lg ${isValid ? 'bg-blue-600 hover:bg-blue-500 text-white cursor-pointer' : 'bg-slate-800 text-slate-600 cursor-not-allowed'}`
        }, 'Proceed to Avatar Studio →')
      );
    }

    function Step2AvatarStudio({ heroData, setHeroData, onNext, onBack }) {
      const config = heroData.avatarConfig;
      const updateConfig = (k, v) => setHeroData({ ...heroData, avatarConfig: { ...config, [k]: v } });

      return h('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/60 p-6 rounded-2xl border border-slate-800' },
        h('div', { className: 'bg-slate-950 rounded-xl p-6 border border-slate-800 flex flex-col items-center justify-center relative overflow-hidden min-h-[300px]' },
          h('div', { className: 'absolute w-48 h-48 rounded-full filter blur-3xl opacity-30', style: { backgroundColor: config.primaryColor } }),
          h('div', { className: 'relative z-10 flex flex-col items-center' },
            h('div', { className: 'w-36 h-36 rounded-2xl flex items-center justify-center border-4 border-slate-800 text-6xl shadow-2xl', style: { backgroundColor: config.primaryColor } }, config.emblem),
            h('span', { className: 'mt-4 text-xs font-mono text-blue-400 font-bold uppercase' }, heroData.heroAlias || 'Unnamed Hero'),
            h('span', { className: 'text-xs text-slate-400 font-semibold' }, heroData.archetype)
          )
        ),
        h('div', { className: 'space-y-5 flex flex-col justify-between' },
          h('div', { className: 'space-y-4' },
            h('h2', { className: 'text-xl font-black text-white' }, '2. Visual Avatar Studio'),
            h('div', null,
              h('label', { className: 'block text-xs font-bold uppercase text-slate-400 mb-2' }, 'Hero Emblem Symbol'),
              h('div', { className: 'flex flex-wrap gap-2' },
                AVATAR_OPTIONS.emblems.map((sym) =>
                  h('button', {
                    key: sym,
                    onClick: () => updateConfig('emblem', sym),
                    className: `w-10 h-10 text-xl rounded-lg border ${config.emblem === sym ? 'bg-blue-600 border-blue-400' : 'bg-slate-800 border-slate-700'}`
                  }, sym)
                )
              )
            ),
            h('div', null,
              h('label', { className: 'block text-xs font-bold uppercase text-slate-400 mb-2' }, 'Aura / Power Energy Color'),
              h('div', { className: 'flex space-x-2' },
                AVATAR_OPTIONS.colors.map((c) =>
                  h('button', {
                    key: c,
                    onClick: () => updateConfig('primaryColor', c),
                    className: `w-8 h-8 rounded-full border-2 ${config.primaryColor === c ? 'border-white scale-110' : 'border-transparent'}`,
                    style: { backgroundColor: c }
                  })
                )
              )
            )
          ),
          h('div', { className: 'flex space-x-3 pt-4' },
            h('button', { onClick: onBack, className: 'w-1/3 py-3 bg-slate-800 text-slate-300 font-bold rounded-lg text-sm' }, '← Back'),
            h('button', { onClick: onNext, className: 'w-2/3 py-3 bg-blue-600 text-white font-bold rounded-lg text-sm' }, 'Power Dossier →')
          )
        )
      );
    }

    function Step3Dossier({ heroData, setHeroData, onNext, onBack }) {
      const updatePower = (idx, field, val) => {
        const updated = [...heroData.powers];
        updated[idx][field] = val;
        setHeroData({ ...heroData, powers: updated });
      };

      const isComplete = heroData.powers.every((p) => p.powerName.trim().length > 0 && p.reflection.trim().length >= 8);

      return h('div', { className: 'space-y-6 bg-slate-900/60 p-6 rounded-2xl border border-slate-800' },
        h('div', null,
          h('h2', { className: 'text-2xl font-black text-white'
